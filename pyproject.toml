[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cotizave"
dynamic = ["version"]
description = "Official Python SDK for the Cotizave API v2 — multi-country exchange-rate references, conversions, history, banks and calendars."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cotizave" }]
keywords = [
    "cotizave",
    "exchange-rate-api",
    "currency-api",
    "forex-api",
    "exchange-rates",
    "currency-conversion",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/cotizave/cotizave-python"
Documentation = "https://docs.cotizave.com"
Repository = "https://github.com/cotizave/cotizave-python"
Issues = "https://github.com/cotizave/cotizave-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/cotizave/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cotizave"]

[tool.hatch.build.targets.sdist]
include = ["src/cotizave", "README.md", "README.es.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# types.py uses the functional TypedDict syntax, whose field annotations are
# evaluated at runtime. The typing.Optional / typing.List spellings are kept there
# for clarity and consistency, so these pyupgrade rewrite rules stay disabled.
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cotizave"]
warn_unused_ignores = true
show_error_codes = true
# Responses are returned as the parsed JSON `dict`, presented structurally as a
# TypedDict without runtime validation (the same "trust the contract" design as
# the TypeScript SDK's casts). Every resource method therefore legitimately
# returns `Any` narrowed to its TypedDict, so this check is disabled on purpose.
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=cotizave --cov-report=term-missing"
