name: Release

# Tag-triggered release. To publish version X.Y.Z:
#   1. set __version__ = "X.Y.Z" in src/cotizave/_version.py (commit it),
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# Pushing the tag runs the full gate, creates a GitHub Release, and — after the
# `pypi` environment approval — publishes to PyPI with Trusted Publishing (OIDC),
# no stored token. The tag must match __version__ or the gate fails.
#
# Requires: a `pypi` GitHub Environment, and a Trusted Publisher on PyPI for this
# repo + `release.yml` + `pypi`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" build twine

      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'from cotizave._version import __version__; print(__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match __version__ ($pkg) in src/cotizave/_version.py"
            exit 1
          fi
          echo "Releasing $pkg"

      - name: Gate (lint, types, tests, build, package)
        run: |
          ruff check .
          ruff format --check .
          mypy
          pytest
          python -m build
          twine check dist/*

  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi # required-reviewers gate (if configured) lives here
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
